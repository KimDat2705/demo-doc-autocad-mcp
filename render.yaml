# render.yaml — Blueprint deploy DEMO 2 (MCP) lên Render bằng Docker.
# Thư mục demo_mcp_autocad/ chính là gốc repo GitHub (riêng, độc lập demo 1).
#
# Các bước:
#   1) Push code (kèm vendor/ODAFileConverter.deb tải tay) lên repo GitHub PRIVATE riêng.
#   2) Render -> New -> Blueprint -> chọn repo -> Render đọc file này.
#   3) Nhập GEMINI_API_KEY khi được hỏi (sync:false -> không lưu trong git).
services:
  - type: web
    name: doc-autocad-mcp-demo          # tên KHÁC demo 1 -> link riêng
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free          # Free: ngủ sau 15p, RAM 512MB (đủ file nhỏ/vừa). File lớn -> nâng 'starter'/'2GB'.
    healthCheckPath: /health          # L — endpoint NHẸ (no API/no bản vẽ); Render tự set RENDER_EXTERNAL_URL -> self-ping giữ thức
    envVars:
      - key: GEMINI_API_KEY
        sync: false      # nhập tay trên dashboard, KHÔNG commit
      # --- MODEL (chốt 2026-08-07) — GHI TƯỜNG MINH, cùng kỷ luật với MAX_SESSIONS/MAX_BAN_VE dưới:
      #     blueprint KHÔNG đặt = deploy ăn theo mặc định trong code, sửa lén trên dashboard thì
      #     lần deploy lại từ blueprint là MẤT. Hai khoá dưới PHẢI ĐỔI CÙNG NHAU (cổng [G] khoá).
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"   # A/B 198 câu × 3 model: đúng số 164/172 (2.5-flash 147), recall
                                    # hơn 14,5 điểm, trục BẪY hoà 3-3 => ngưỡng GO đặt trước = ĐẠT.
                                    # GIÁ: chậm ×2,3 và đắt hơn (×8 là tính theo giá NIÊM YẾT — đo lại
                                    # thấy implicit caching đang chạy sẵn nên đó là CẬN TRÊN).
                                    # ⛔ Gemini 3 BỎ QUA `temperature` (đo: 2.5 tất định 1 đáp án/5 lần,
                                    # 3.6 tản 5/5) => chống bịa dựa HOÀN TOÀN vào hàng rào phía code.
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3.5-flash,gemini-3.5-flash-lite"   # CÙNG ĐỜI 3.x với model chính: trộn đời làm
                                    # vỡ thought signature => phải chạy lại từ đầu = gọi lại TOÀN BỘ tool
                                    # (×2 thời gian, ×2 RAM trên gói free vốn đã sát trần). Cả 3 model đã
                                    # ĐO THẬT là còn sống (đối chứng âm gemini-2.0-flash ra 404 CHẾT).
                                    # ⚠ 3.5-flash-lite BỊA HANDLE 2/198 ca => chỉ dùng làm nấc CUỐI.
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: READFILE_MAX_MB
        value: "45"      # lên gói RAM cao hơn -> tăng ~250 để đọc file lớn
      - key: COOKIE_SECURE
        value: "true"    # E6 — Render chạy HTTPS -> cookie sid gắn cờ Secure (không lộ qua HTTP)
      # --- Chịu tải / chống chết giữa buổi (đo thật 2026-07-30) — GHI TƯỜNG MINH để không lệch ngầm với app.py ---
      - key: MAX_SESSIONS
        value: "4"       # trần SỐ PHIÊN (phiên rỗng ~965 byte). KHÔNG phải trần RAM — đo thật: số bản vẽ trong RAM
                         # bằng số request đồng thời (--threads), nên hạ số này tiết kiệm 0MB. Trần RAM = MAX_BAN_VE (lát 2).
      - key: SESSION_TTL_MIN
        value: "30"
      - key: KEEPALIVE_MIN
        value: "5"       # 10 -> 5: chu kỳ 10' chỉ cách ngưỡng ngủ 15' đúng 5' = chịu được 0 nhịp trượt (đo thật)
      - key: LOCK_WAIT_S
        value: "3"       # trần chờ khoá phiên. Nếu /health thấy metrics.tu_choi tăng bất thường -> nâng lên 5 (0 dòng code)
      - key: MAX_BAN_VE
        value: "1"       # TRẦN RAM THẬT: số BẢN VẼ trong RAM cùng lúc. Do thật goi free 512MB: web 105MB + 1 ban ve
                         # 23MiB = 289MB -> 394MB (77%); 2 ban ve -> 683MB = OOM. Len goi 2GB moi dat 2-3, va PHAI
                         # doc ram_mb that o /health truoc khi nang. 0 = TAT gate (duong lui khan cap).
      - key: CLOSE_WAIT_S
        value: "5"       # trần chờ XÁC NHẬN bản vẽ cũ đã ra khỏi RAM trước khi nhận bản mới
      - key: NAP_HAN_S
        value: "1500"    # hạn tự lành của 1 suất đang nạp (>= 2x worst-case nạp .dwg: 40s spawn + 600s nạp)
      - key: MCP_READY_S
        value: "60"      # 40s hard-code cũ quá mỏng: đo thật spawn biến động 2.06s -> 17.97s trên CÙNG máy,
                         # CPU chia sẻ của Render free còn chậm hơn ~3.3x
